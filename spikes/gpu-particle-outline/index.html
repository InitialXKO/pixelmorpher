<script>
'use strict';
/* ================================================================
   合流架构（两级 pattern）：
   - 骨架：参数化部件 + 变体推导（base+东向+镜像/对角共享）+ 方向排序
     + 语义表（像素身份）+ 全局格渲染（整屏低清、屏幕空间求值）。
   - shape：图元（圆角矩形/椭圆/胶囊）∪ 多边形轮廓——两者都在加载期
     烘焙成同一种 mask 瓦片（R=表面档位/254 外环/255 外，G=glint 候选），
     运行时统一采样，片元 O(1)。距离场只出现在烘焙期（产边带/方向掩码）。
   - pattern 两级：层语言在下管「面」——mask 原语层程序烘焙出每像素的
     基础档位（渐变/条纹/棋盘/噪点/鳞片）；枚举槽位在上管「边与光」——
     LIGHT/OUTLINE/RIM/GLINT 运行时按邻居占据以枚举形式调制档位。
   - 出色：只查调色板（家族×8 档纹理），无 mix 出界色。
   ================================================================ */

// === PURE BEGIN ===（纯逻辑段，verify.mjs 抽取校验）
/** 线段距离（仅烘焙期用） */
function sdSegment(px, py, s) {
  const vx = s[2] - s[0], vy = s[3] - s[1];
  const wx = px - s[0], wy = py - s[1];
  const t = Math.max(0, Math.min(1, (wx * vx + wy * vy) / (vx * vx + vy * vy || 1)));
  const dx = wx - vx * t, dy = wy - vy * t;
  return Math.hypot(dx, dy);
}
/** turtle 指令 → 折线点（logo 语言） */
function turtleToPoints(cmds, start = [0, 0], headingDeg = -90) {
  const pts = [[start[0], start[1]]];
  let [x, y] = start, h = (headingDeg * Math.PI) / 180;
  for (const [op, v] of cmds) {
    if (op === 'FD') { x += Math.cos(h) * v; y += Math.sin(h) * v; pts.push([x, y]); }
    else if (op === 'RT') h += (v * Math.PI) / 180;
    else if (op === 'LT') h -= (v * Math.PI) / 180;
    else throw new Error('turtle: 未知指令 ' + op);
  }
  return pts;
}
/** 折线点 → 线段 [x1,y1,x2,y2]（已相对枢轴） */
function pointsToSegments(points, pivot) {
  const segs = [];
  for (let i = 0; i < points.length - 1; i++) {
    segs.push([points[i][0] - pivot[0], points[i][1] - pivot[1], points[i + 1][0] - pivot[0], points[i + 1][1] - pivot[1]]);
  }
  return segs;
}
/** 点在闭合折线内（even-odd） */
function pointInPolygon(px, py, points) {
  let inside = false;
  for (let i = 0, j = points.length - 1; i < points.length; j = i++) {
    const [xi, yi] = points[i];
    const [xj, yj] = points[j];
    if ((yi > py) !== (yj > py) && px < ((xj - xi) * (py - yi)) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
/** 形状场（烘焙期）：返回 {inside, d}，d 为到边界距离（近似即可，只产掩码用）。
 *  shape: {kind:'rect'|'ellipse'|'capsule'|'poly', size:[w,h], roundness, points?, pivot?}
 *  采样点为部件局部坐标（原点=部件中心，y 向下）。 */
function shapeField(shape, px, py) {
  const [w, h] = shape.size;
  if (shape.kind === 'poly') {
    const pts = shape.points, piv = shape.pivot || [0, 0];
    const rel = pts.map(([x, y]) => [x - piv[0], y - piv[1]]);
    let d = Infinity;
    for (let i = 0; i < rel.length; i++) {
      const a = rel[i], b = rel[(i + 1) % rel.length];
      d = Math.min(d, sdSegment(px, py, [a[0], a[1], b[0], b[1]]));
    }
    return { inside: pointInPolygon(px, py, rel), d };
  }
  if (shape.kind === 'ellipse') {
    const rx = Math.max(w / 2, 0.5), ry = Math.max(h / 2, 0.5);
    const q = Math.hypot(px / rx, py / ry);
    return { inside: q <= 1, d: Math.abs(q - 1) * Math.min(rx, ry) };
  }
  if (shape.kind === 'capsule') {
    const r = Math.min(w, h) / 2;
    const ax = Math.max(0, w / 2 - r), ay = Math.max(0, h / 2 - r);
    const cx = Math.max(-ax, Math.min(ax, px)), cy = Math.max(-ay, Math.min(ay, py));
    const d = Math.hypot(px - cx, py - cy) - r;
    return { inside: d <= 0, d: Math.abs(d) };
  }
  // rect（圆角）：标准圆角盒距离
  const r = Math.max(0, Math.min(1, shape.roundness ?? 0)) * Math.min(w, h) / 2;
  const qx = Math.abs(px) - (w / 2 - r), qy = Math.abs(py) - (h / 2 - r);
  const ax = Math.max(qx, 0), ay = Math.max(qy, 0);
  const dOut = Math.hypot(ax, ay) + Math.min(Math.max(qx, qy), 0) - r;
  return { inside: dOut <= 0, d: Math.abs(dOut) };
}
/** pattern 层语言：层 = { mask, slot, ch }，后层覆盖先层（烘焙期求值，管「面」） */
function maskHit(mask, ctx) {
  switch (mask.m) {
    case 'all': return true;
    case 'inside': return ctx.inside;
    case 'edge': return ctx.d <= mask.w;
    case 'band': return ctx.d > mask.w0 && ctx.d <= mask.w1;
    case 'bands': {
      const v = mask.axis === 'x' ? ctx.px : mask.axis === 'y' ? ctx.py : ctx.px + ctx.py * 0.35;
      const f = ((v / mask.f + (mask.ph ?? 0)) % 1 + 1) % 1;
      return f < (mask.duty ?? 0.5);
    }
    case 'checker': {
      const cx = Math.floor(ctx.px / mask.f), cy = Math.floor(ctx.py / mask.f);
      return ((cx + cy) % 2 + 2) % 2 === 0;
    }
    case 'noise': {
      const cx = Math.floor(ctx.px / mask.f), cy = Math.floor(ctx.py / mask.f);
      let hs = Math.sin(cx * 127.1 + cy * 311.7 + (mask.seed ?? 0) * 74.7) * 43758.5453;
      hs -= Math.floor(hs);
      return hs > (mask.gt ?? 0.72);
    }
    case 'gradLt': {
      const v = mask.axis === 'x' ? ctx.px01 : ctx.py01;
      return v < mask.t;
    }
    case 'facing': {
      if (ctx.d > (mask.w ?? 1.6)) return false;
      const deg = (Math.atan2(ctx.gy, ctx.gx) * 180) / Math.PI;
      const diff = Math.abs(((deg - mask.deg) % 360 + 540) % 360 - 180);
      return diff <= (mask.tol ?? 55);
    }
    default: throw new Error('pattern: 未知 mask 原语 ' + mask.m);
  }

/** 枚举形式目录（层语言一侧：光照渐变/表面，烘焙编译） */
const F = {
  lightFlat: (slot = 2) => [{ mask: { m: 'inside' }, slot }],
  lightGradY: (slots = [3, 2, 1]) => [
    { mask: { m: 'inside' }, slot: slots[2] },
    { mask: { m: 'gradLt', axis: 'y', t: 0.66 }, slot: slots[1] },
    { mask: { m: 'gradLt', axis: 'y', t: 0.33 }, slot: slots[0] },
  ],
  lightGradX: (slots = [1, 2, 3]) => [
    { mask: { m: 'inside' }, slot: slots[0] },
    { mask: { m: 'gradLt', axis: 'x', t: 0.66 }, slot: slots[2] },
    { mask: { m: 'gradLt', axis: 'x', t: 0.33 }, slot: slots[1] },
  ],
  outlineDark: (w = 1) => [{ mask: { m: 'edge', w }, slot: 0 }],
  rimBand: (deg, slot = 4, w = 1.8, tol = 60) => [{ mask: { m: 'facing', deg, tol, w }, slot }],
  glintFace: (deg = 45, tol = 65) => [{ mask: { m: 'facing', deg, tol, w: 99 }, slot: 0, ch: 'glint' }],
  stripes: (slot = 5, f = 3, ph = 0, duty = 0.5) => [{ mask: { m: 'bands', axis: 'd', f, ph, duty }, slot }],
  checker: (slot = 5, f = 3) => [{ mask: { m: 'checker', f }, slot }],
  speckle: (slot = 3, f = 2, seed = 1, gt = 0.72) => [{ mask: { m: 'noise', f, seed, gt }, slot }],
  scales: (slot = 1, f = 3) => [{ mask: { m: 'bands', axis: 'y', f, ph: 0, duty: 0.5 }, slot }],
};
/** shape + 层程序 → mask 瓦片。采样点 = 整数局部格（原点=部件中心，瓦片含 2px 边距）。
 *  R：0..127 表面档位（占据）／254 外环（未占据但距边界 ≤1.5，供 OUTER 描边）／255 外；
 *  G：glint 候选（程序无 glint 层时全 255＝不设门）。返回 {w,h,cx,cy,data}，(cx,cy)=原点瓦片像素坐标。 */
function compileTile(shape, program) {
  const M = 2;
  const w = Math.ceil(shape.size[0]) + M * 2;
  const h = Math.ceil(shape.size[1]) + M * 2;
  const cx = Math.floor(w / 2), cy = Math.floor(h / 2);
  const hasGlint = program.some((l) => l.ch === 'glint');
  const distAt = (lx, ly) => shapeField(shape, lx, ly).d;
  const data = new Uint8Array(w * h * 4);
  for (let j = 0; j < h; j++) {
    for (let i = 0; i < w; i++) {
      const lx = i - cx, ly = j - cy;
      const o = (j * w + i) * 4;
      data[o + 3] = 255;
      const f0 = shapeField(shape, lx, ly);
      const occ = f0.inside || f0.d <= 0.5;
      if (!occ) {
        data[o] = f0.d <= 1.5 ? 254 : 255;
        continue;
      }
      const gx = distAt(lx + 1, ly) - distAt(lx - 1, ly);
      const gy = distAt(lx, ly + 1) - distAt(lx, ly - 1);
      const ctx = {
        px: lx, py: ly,
        px01: shape.size[0] > 0 ? (lx + shape.size[0] / 2) / shape.size[0] : 0.5,
        py01: shape.size[1] > 0 ? (ly + shape.size[1] / 2) / shape.size[1] : 0.5,
        inside: f0.inside, d: f0.d, gx, gy,
      };
      let slot = 2, g = hasGlint ? 0 : 255;
      for (const layer of program) {
        if (!maskHit(layer.mask, ctx)) continue;
        if (layer.ch === 'glint') g = 255;
        else slot = layer.slot;
      }
      data[o] = slot;
      data[o + 1] = g;
    }
  }
  return { w, h, cx, cy, data };
}
/** 图集货架打包 */
function packAtlas(tiles, atlasW) {
  const placements = [];
  let x = 0, y = 0, shelfH = 0;
  for (const t of tiles) {
    if (x + t.w > atlasW) { x = 0; y += shelfH; shelfH = 0; }
    placements.push([x, y]);
    x += t.w;
    shelfH = Math.max(shelfH, t.h);
  }
  return { placements, height: y + shelfH };
}
/** 变体推导（参数化版骨架）：base + 东向(2)，其余镜像/对角共享 */
const MIRROR_VARIANT = { 1: 7, 7: 1, 3: 5, 5: 3 };
const DIAGONAL_MAIN = { 1: 2, 3: 4, 5: 4, 7: 6 };
function mirrorParams(p) {
  const out = { ...p };
  if (p.pivot) out.pivot = [-p.pivot[0], p.pivot[1]];
  if (p.off) out.off = [-p.off[0], p.off[1]];
  if (p.angle !== undefined) out.angle = -p.angle;
  if (p.poly) out.poly = p.poly.map(([x, y]) => [-x, y]);
  return out;
}
/** 变体推导链：返回来源变体的原始覆盖（不做镜像，镜像在合并后统一施加一次） */
function resolveVariantParams(part, variant) {
  if (part.variants && part.variants[variant]) return part.variants[variant];
  const mirror = MIRROR_VARIANT[variant];
  if (mirror !== undefined && part.variants && part.variants[mirror]) return part.variants[mirror];
  const main = DIAGONAL_MAIN[variant];
  if (main !== undefined) {
    if (part.variants && part.variants[main]) return part.variants[main];
    const m2 = MIRROR_VARIANT[main];
    if (m2 !== undefined && part.variants && part.variants[m2]) return part.variants[m2];
  }
  if (variant === 6 && part.variants && part.variants[2]) return part.variants[2];
  return {};
}
/** 该方向的推导是否经过镜像（与 resolveVariantParams 同一条链） */
function variantMirrored(part, variant) {
  if (part.variants && part.variants[variant]) return false;
  const mirror = MIRROR_VARIANT[variant];
  if (mirror !== undefined && part.variants && part.variants[mirror]) return true;
  const main = DIAGONAL_MAIN[variant];
  if (main !== undefined) {
    if (part.variants && part.variants[main]) return false;
    const m2 = MIRROR_VARIANT[main];
    if (m2 !== undefined && part.variants && part.variants[m2]) return true;
  }
  if (variant === 6 && part.variants && part.variants[2]) return true;
  if (variant === 4) return true;
  return false;
}
/** 部件 × 方向 × 服装 → 已解析参数（含 shape 描述与层程序） */
function resolvePart(part, variantIndex, costume) {
  let p = { ...part.base, ...resolveVariantParams(part, variantIndex) };
  // 镜像在合并后统一施加：base 的 pivot/off 与多边形轮廓一并翻（参数化版只翻覆盖项，多边形部件会翻错）
  if (variantMirrored(part, variantIndex)) p = mirrorParams(p);
  if (costume && part.costumeKeys && part.costumeKeys.length > 0) {
    const c = costume[part.costumeKeys[0]];
    if (c === null) { p.size = [0.001, 0.001]; p.hidden = true; }
    else if (c) {
      if (c.pal) p.pal = c.pal;
      if (c.size) p.size = c.size;
      if (c.roundness !== undefined) p.roundness = c.roundness;
    }
  }
  const shape = p.poly
    ? { kind: 'poly', size: p.size, points: p.poly, pivot: p.polyPivot || [0, 0] }
    : { kind: p.shapeKind || 'rect', size: p.size, roundness: p.roundness ?? 0 };
  return { params: p, shape, program: p.surface || [{ mask: { m: 'inside' }, slot: 2 }] };
}
/** 方向遮挡排序（参数化版骨架）：4 主序 + 对角共享 */
const DRAW_ORDER_MAIN = {
  0: ['cape', 'left_arm', 'left_leg', 'right_leg', 'right_arm', 'torso', 'head'],
  4: ['cape', 'left_arm', 'left_leg', 'right_leg', 'right_arm', 'torso', 'head'],
  2: ['cape', 'left_arm', 'left_leg', 'torso', 'head', 'right_leg', 'right_arm'],
  6: ['cape', 'right_arm', 'right_leg', 'torso', 'head', 'left_leg', 'left_arm'],

const DRAW_ORDER_MAP = { 0: 0, 1: 2, 2: 2, 3: 4, 4: 4, 5: 4, 6: 6, 7: 6 };
function sortParts(parts, v) {
  const order = DRAW_ORDER_MAIN[DRAW_ORDER_MAP[v]];
  const result = [];
  for (const layer of order) {
    const inLayer = parts.filter((p) => p.drawLayer === layer);
    inLayer.sort((a, b) => a.sortOrder - b.sortOrder);
    result.push(...inLayer);
  }
  return result;
}
/** 实例打包：19 float —— pos2 size2 rot1 pivotTile2 tile4 misc4(family,seed,modes 打包,0) param4(rimI,glintI,phase,0)
 *  modes 打包 = light + outline*8 + rim*64 + glint*512（各 3 bit） */
const INSTANCE_FLOATS = 19;

  const buf = new Float32Array(els.length * INSTANCE_FLOATS);
  els.forEach((el, i) => {
    const o = i * INSTANCE_FLOATS;
    buf[o] = el.pos[0]; buf[o + 1] = el.pos[1];
    buf[o + 2] = el.size[0]; buf[o + 3] = el.size[1];
    buf[o + 4] = el.rot;
    buf[o + 5] = el.tileCx; buf[o + 6] = el.tileCy;
    buf[o + 7] = el.tile[0]; buf[o + 8] = el.tile[1]; buf[o + 9] = el.tile[2]; buf[o + 10] = el.tile[3];
    buf[o + 11] = el.family; buf[o + 12] = el.seed;
    buf[o + 13] = el.modes[0] + el.modes[1] * 8 + el.modes[2] * 64 + el.modes[3] * 512;
    buf[o + 14] = 0;

// === PURE END ===

// ---------- 枚举槽位（运行时，管「边与光」） ----------
const LIGHT = { FLAT: 0, TOP: 1, TOP_LEFT: 2, TOP_RIGHT: 3, BOTTOM: 4, BACK: 5, AMBIENT: 6 };
const OUTLINE = { NONE: 0, OUTER: 1, INNER: 2, DROP: 3, TOP_ONLY: 4 };

const GLINT = { NONE: 0, CORNER: 1, STAR: 2, EDGE_FLOW: 3 };
const SHAPEK = { RECT: 'rect', ELLIPSE: 'ellipse', CAPSULE: 'capsule', POLY: 'poly' };

// ---------- 调色板：家族 × 8 档 [描边, 暗, 本, 亮, 高光, 强调, 次强调, 纯白] ----------
const rgb = (h) => [((h >> 16) & 255) / 255, ((h >> 8) & 255) / 255, (h & 255) / 255];
const PAL = {
  skin:     [0x2a1a10, 0xc89870, 0xf2c896, 0xffe0b8, 0xfff2dd, 0xe07850, 0x8a5a38, 0xffffff],
  shirt:    [0x101830, 0x2a4aa0, 0x4a6fd4, 0x7a9ff8, 0xd6e4ff, 0xf2c14e, 0x243a78, 0xffffff],
  pants:    [0x0a0e20, 0x202a50, 0x3a4a7a, 0x5a6aaa, 0xaabbee, 0x8a94b8, 0x161e3c, 0xffffff],
  shoe:     [0x140c08, 0x3a2818, 0x6a4a30, 0x9a7050, 0xd8b088, 0xb8b8c8, 0x241408, 0xffffff],
  scarf:    [0x300808, 0xa03030, 0xe05050, 0xff7a7a, 0xffc4c4, 0xf2c14e, 0x701818, 0xffffff],
  hair:     [0x140a04, 0x3a2010, 0x6a3a20, 0x9a5a38, 0xd8a068, 0xe05050, 0x241105, 0xffffff],
  eye:      [0x202030, 0xb8c4d8, 0xffffff, 0xffffff, 0xffffff, 0x7a9ff8, 0x202030, 0xffffff],
  pupil:    [0x101020, 0x101020, 0x101020, 0x101020, 0xffffff, 0x101020, 0x101020, 0xffffff],
  armor:    [0x1a1a22, 0x5a5a6a, 0x8a8a9a, 0xb8b8c8, 0xffffff, 0xf2c14e, 0x3a3a48, 0xffffff],

// ---------- 瓦片图集（按 方向×服装 懒构建，编译结果缓存） ----------
const tileCache = new Map();
function tileKeyOf(part, variant, costumeName, resolved) {
  return [part.key, variant, costumeName, JSON.stringify(resolved.shape),
    JSON.stringify(resolved.program.map((l) => [l.mask.m, l.slot, l.ch]))].join('|');
}
let atlasState = null; // { variant, costumeName, tex, map: Map<key, {tile, place, resolved} | null> }
function ensureAtlas(gl, variant, costumeName) {
  if (atlasState && atlasState.variant === variant && atlasState.costumeName === costumeName) return atlasState;
  const costume = COSTUMES[costumeName];
  const tiles = [], entries = [];
  const map = new Map();
  for (const part of PARTS) {
    const resolved = resolvePart(part, variant, costume);
    if (resolved.params.hidden) { map.set(part.key, null); continue; }
    const key = tileKeyOf(part, variant, costumeName, resolved);
    let tile = tileCache.get(key);
    if (!tile) { tile = compileTile(resolved.shape, resolved.program); tileCache.set(key, tile); }
    tiles.push(tile);
    entries.push([part.key, tile, resolved]);
  }
  const { placements, height } = packAtlas(tiles, 256);
  const data = new Uint8Array(256 * height * 4);
  tiles.forEach((tile, i) => {
    const [ax, ay] = placements[i];
    for (let j = 0; j < tile.h; j++) {
      data.set(tile.data.subarray(j * tile.w * 4, (j + 1) * tile.w * 4), ((ay + j) * 256 + ax) * 4);
    }
    map.set(entries[i][0], { tile, place: [ax, ay], resolved: entries[i][2] });
  });
  if (atlasState && atlasState.tex) gl.deleteTexture(atlasState.tex);
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, 256, height, 0, gl.RGBA, gl.UNSIGNED_BYTE, data);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  atlasState = { variant, costumeName, tex, map };
  return atlasState;
}

const canvas = document.getElementById('c');

if (!gl) throw new Error('WebGL2 不可用');
const VIEW_H = 180;
let lowW = 320;
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  const aspect = w / h;
  lowW = Math.max(1, Math.round(VIEW_H * aspect));
  canvas.width = lowW; canvas.height = VIEW_H;
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
}

function compileShader(type, src) {
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src); gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error('着色器编译失败: ' + gl.getShaderInfoLog(sh) + '\n' + src);
  return sh;
}
function makeProgram(vs, fs) {
  const pr = gl.createProgram();
  gl.attachShader(pr, compileShader(gl.VERTEX_SHADER, vs));
  gl.attachShader(pr, compileShader(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(pr);
  if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) throw new Error('程序链接失败: ' + gl.getProgramInfoLog(pr));
  return pr;
}

// 主程序：instanced 瓦片 quad
const partProg = makeProgram(
`#version 300 es
layout(location=0) in vec2 aCorner;
layout(location=1) in vec2 iPos;
layout(location=2) in vec2 iSize;
layout(location=3) in float iRot;
layout(location=4) in vec2 iTileC;
layout(location=5) in vec4 iTile;
layout(location=6) in vec4 iMisc;
layout(location=7) in vec4 iParam;
uniform vec2 uCam; uniform vec2 uViewHalf; uniform vec2 uRes;
out vec2 vCenterScreen; out float vRot; out vec4 vTile; out vec2 vTileC; out vec4 vMisc; out vec4 vParam;
void main(){
  float c = cos(iRot), s = sin(iRot);
  vec2 local = aCorner * iSize;                    // 局部坐标 y 向下
  vec2 woff = vec2(local.x * c + local.y * s, local.x * s - local.y * c); // (x,-y) 旋转到 y-up 世界
  vec2 world = iPos + woff;
  vCenterScreen = ((iPos - uCam) / uViewHalf * 0.5 + 0.5) * uRes;
  vRot = iRot; vTile = iTile; vTileC = iTileC; vMisc = iMisc; vParam = iParam;
  float z = 0.9 - float(gl_InstanceID) * 0.02;
  gl_Position = vec4((world - uCam) / uViewHalf, z, 1.0);
}`,
`#version 300 es
precision highp float;
uniform sampler2D uAtlas; uniform sampler2D uPal; uniform float uTime;
in vec2 vCenterScreen; in float vRot; in vec4 vTile; in vec2 vTileC; in vec4 vMisc; in vec4 vParam;
out vec4 oColor;
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
int tileRAt(ivec2 g){
  ivec2 tp = ivec2(vTile.xy) + ivec2(vTileC) + g;
  if (tp.x < int(vTile.x) || tp.y < int(vTile.y) || tp.x >= int(vTile.x + vTile.z) || tp.y >= int(vTile.y + vTile.w)) return 255;
  return int(texelFetch(uAtlas, tp, 0).r * 255.0 + 0.5);
}
float tileGAt(ivec2 g){
  ivec2 tp = ivec2(vTile.xy) + ivec2(vTileC) + g;
  if (tp.x < int(vTile.x) || tp.y < int(vTile.y) || tp.x >= int(vTile.x + vTile.z) || tp.y >= int(vTile.y + vTile.w)) return 0.0;
  return texelFetch(uAtlas, tp, 0).g;
}
void main(){
  float mp = vMisc.z;
  int lm = int(mod(mp, 8.0));
  int om = int(mod(mp / 8.0, 8.0));
  int rm = int(mod(mp / 64.0, 8.0));
  int gm = int(mp / 512.0);
  int family = int(vMisc.x + 0.5);
  vec2 d = gl_FragCoord.xy - vCenterScreen;
  float c = cos(vRot), s = sin(vRot);
  vec2 lup = vec2(d.x * c + d.y * s, -d.x * s + d.y * c);  // 局部 y-up
  ivec2 g = ivec2(floor(vec2(lup.x, -lup.y) + 0.5));       // 局部格 y 向下（与瓦片一致）
  int r0 = tileRAt(g);
  bool occ = r0 < 128;
  if (!occ) {
    if (r0 == 254) {
      bool nL = tileRAt(g + ivec2(-1, 0)) < 128, nR = tileRAt(g + ivec2(1, 0)) < 128;
      bool nT = tileRAt(g + ivec2(0, -1)) < 128, nB = tileRAt(g + ivec2(0, 1)) < 128;
      bool draw = false;
      if (om == 1) draw = nL || nR || nB || nT;
      else if (om == 3) draw = nR || nB;
      else if (om == 4) draw = nT;
      if (draw) { oColor = vec4(texelFetch(uPal, ivec2(0, family), 0).rgb, 1.0); return; }
    }
    discard;
  }
  bool inL = !(tileRAt(g + ivec2(-1, 0)) < 128), inR = !(tileRAt(g + ivec2(1, 0)) < 128);
  bool inT = !(tileRAt(g + ivec2(0, -1)) < 128), inB = !(tileRAt(g + ivec2(0, 1)) < 128);
  int slot = r0;
  // LIGHT 枚举：只调制 1..3 档（层语言给的强调档 4..7 不动）
  bool isLit = false, isDark = false;
  if (lm == 1) { isLit = inT; isDark = inB; }
  else if (lm == 2) { isLit = inT || inL; isDark = inB || inR; }
  else if (lm == 3) { isLit = inT || inR; isDark = inB || inL; }
  else if (lm == 4) { isLit = inB; isDark = inT; }
  else if (lm == 5) { isLit = inL || inR || inB || inT; isDark = !isLit; }
  else if (lm == 6) { isLit = true; }
  if (slot >= 1 && slot <= 3) { if (isDark) slot = 1; else if (isLit) slot = 3; }
  // RIM 枚举：命中写高光档 4；强度走哈希门（保持档位制）
  bool rimHit = false;
  if (rm == 1) rimHit = inT && inL;
  else if (rm == 2) rimHit = inT && inR;
  else if (rm == 3) rimHit = inL || inR;
  else if (rm == 4) rimHit = inB;
  else if (rm == 5) rimHit = inL || inR || inB || inT;
  else if (rm == 6) {
    float band = fract(uTime * 0.6 + vParam.z);
    float yN = float(g.y) / max(vTile.w - 4.0, 1.0) + 0.5;
    rimHit = (inL || inR || inB || inT) && abs(yN - band) < 0.12;
  }
  if (rimHit && hash12(vec2(g) + vMisc.y) < vParam.x) slot = 4;
  // GLINT 枚举：只在烘焙候选区（tile G）内点亮
  if (tileGAt(g) > 0.35) {
    bool gHit = false;
    if (gm == 1) gHit = inT && inR;
    else if (gm == 2) gHit = (inL || inR || inB || inT) && hash12(vec2(g) + floor(uTime * 8.0)) > 0.93;
    else if (gm == 3) {
      float along = (inL || inR) ? float(g.y) : float(g.x);
      gHit = (inL || inR || inB || inT) && fract(along * 0.25 - uTime * 1.5) < 0.18;
    }
    if (gHit && hash12(vec2(g) * 1.7 + vMisc.y) < vParam.y) slot = 4;
  }
  // OUTLINE INNER
  if (om == 2 && (inL || inR || inB || inT)) slot = 0;
  oColor = vec4(texelFetch(uPal, ivec2(slot, family), 0).rgb, 1.0);
}`);

// 调色板纹理（8 档 × 家族）
const palTex = gl.createTexture();
{
  const data = new Uint8Array(8 * PAL_NAMES.length * 4);
  PAL_NAMES.forEach((name, fi) => {
    PAL[name].forEach((hex, si) => {
      const [r, g, b] = rgb(hex);
      const o = (fi * 8 + si) * 4;
      data[o] = Math.round(r * 255); data[o + 1] = Math.round(g * 255); data[o + 2] = Math.round(b * 255); data[o + 3] = 255;
    });
  });
  gl.bindTexture(gl.TEXTURE_2D, palTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, 8, PAL_NAMES.length, 0, gl.RGBA, gl.UNSIGNED_BYTE, data);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
}

{

  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.bindBuffer(gl.ARRAY_BUFFER, instBuf);
  const strides = [[1, 2, 0], [2, 2, 2], [3, 1, 4], [4, 2, 5], [5, 4, 7], [6, 4, 11], [7, 4, 15]];
  for (const [loc, n, off] of strides) {
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, n, gl.FLOAT, false, INSTANCE_FLOATS * 4, off * 4);
    gl.vertexAttribDivisor(loc, 1);
  }
  gl.bindVertexArray(null);
}

  gl.bindVertexArray(solidVAO);
  gl.bindBuffer(gl.ARRAY_BUFFER, solidBuf);
  const layout = [[0, 2, 0], [1, 2, 2], [2, 4, 4], [3, 1, 8]];
  for (const [loc, n, off] of layout) {
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, n, gl.FLOAT, false, 9 * 4, off * 4);
  }
  gl.bindVertexArray(null);
}
function buildScenery(charX, charY, onGround) {
  const verts = [];
  const quad = (cx, cy, w, h, color, mode) => {
    const x0 = cx - w / 2, x1 = cx + w / 2, y0 = cy - h / 2, y1 = cy + h / 2;
    const corners = [[x0, y0, -1, -1], [x1, y0, 1, -1], [x1, y1, 1, 1], [x0, y0, -1, -1], [x1, y1, 1, 1], [x0, y1, -1, 1]];
    for (const [x, y, lx, ly] of corners) verts.push(x, y, lx, ly, ...color, mode);
  };
  const base = Math.floor(charX / 24) * 24;
  for (let i = -10; i <= 10; i++) {
    const gx = base + i * 24;
    const hh = 1.5 + (Math.abs(i * 7 + Math.floor(charX / 24)) % 3);
    quad(gx, -1.5 + hh / 2 - 1.5, 4, hh, [0.118, 0.118, 0.243, 1], 0);
  }
  quad(charX, -0.75, 4000, 1.5, [0.165, 0.165, 0.322, 1], 0);
  const shrink = onGround ? 1 : Math.max(0.5, 1 - charY / 50);
  quad(charX, 0.4, 20 * shrink, 5 * shrink, [0.031, 0.031, 0.078, 0.5 * shrink], 1);
  return new Float32Array(verts);
}

// ---------- 角色状态与动画（参数化版骨架） ----------
const char = { x: 0, y: 0, vy: 0, onGround: true, variant: 0, lockedVariant: false, moving: false, phase: 0 };
let currentCostume = 'casual';
let bakeEnabled = false, debugEnabled = false;
const keys = Object.create(null);
window.addEventListener('keydown', (e) => {
  keys[e.code] = true;
  const d = parseInt(e.key);
  if (d >= 1 && d <= 8) {
    char.variant = d - 1; char.lockedVariant = true; updateDirButtons();
    const b = document.getElementById('btnLock');
    b.textContent = '锁定: 开'; b.classList.add('on');
  }
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
const MOVE_SPEED = 72, JUMP_V = 200, GRAVITY = 720;
function updateCharacter(dt) {
  let ix = 0;
  if (keys['KeyA'] || keys['ArrowLeft']) ix -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) ix += 1;
  char.moving = ix !== 0;
  if (ix !== 0 && !char.lockedVariant) { char.variant = ix > 0 ? 2 : 6; updateDirButtons(); }
  char.x += ix * MOVE_SPEED * dt;
  if ((keys['KeyW'] || keys['ArrowUp']) && char.onGround) { char.vy = JUMP_V; char.onGround = false; }
  if (!char.onGround) {
    char.vy -= GRAVITY * dt; char.y += char.vy * dt;
    if (char.y <= 0) { char.y = 0; char.vy = 0; char.onGround = true; }
  }
  char.phase += dt * (char.moving ? 12 : 2.5);
}
function computeIdleAnims(t) {
  const legA = Math.sin(t * 2.0) * 0.06, armA = Math.sin(t * 2.0 + 1.0) * 0.05, bob = Math.sin(t * 2.0) * 0.4;
  const capeA = Math.sin(t * 2.0 + 0.6) * 0.07;
  return {
    cape: { a: capeA, dy: bob, rim: 0, glint: 0 },
    armBack: { a: armA, dy: bob, rim: 0, glint: 0 }, legBack: { a: -legA, dy: bob, rim: 0, glint: 0 },
    shoeBack: { a: -legA, dy: bob, rim: 0, glint: 0 }, body: { a: 0, dy: bob, rim: 0, glint: 0 },
    scarf: { a: Math.sin(t * 4.0) * 0.05, dy: bob, rim: 0, glint: 0 },
    head: { a: 0, dy: bob, rim: 0, glint: 0 }, hair: { a: 0, dy: bob, rim: 0, glint: 0 },
    legFront: { a: legA, dy: bob, rim: 0, glint: 0 }, shoeFront: { a: legA, dy: bob, rim: 0, glint: 0 },
    eye: { a: 0, dy: bob, rim: 0, glint: 0 }, pupil: { a: 0, dy: bob, rim: 0, glint: 0 },
    armFront: { a: armA, dy: bob, rim: 0, glint: 0 }, sword: { a: armA, dy: bob, rim: 0, glint: 0.1 },
  };
}
function computeMovingAnims(phase) {
  const legA = Math.sin(phase) * 0.75, armA = -Math.sin(phase) * 0.65;
  const bob = Math.abs(Math.sin(phase)) * 1.2, rimB = 0.20, glintB = 0.25;
  return {
    cape: { a: Math.sin(phase + 0.8) * 0.16 - 0.12, dy: bob, rim: 0, glint: 0 },
    armBack: { a: armA, dy: bob, rim: rimB, glint: glintB },
    legBack: { a: -legA, dy: bob, rim: 0, glint: 0 }, shoeBack: { a: -legA, dy: bob, rim: 0, glint: 0 },
    body: { a: 0, dy: bob, rim: 0, glint: 0 }, scarf: { a: Math.sin(phase * 2) * 0.08, dy: bob, rim: 0, glint: 0 },
    head: { a: 0, dy: bob, rim: 0, glint: 0 }, hair: { a: 0, dy: bob, rim: 0, glint: 0 },
    legFront: { a: legA, dy: bob, rim: 0, glint: 0 }, shoeFront: { a: legA, dy: bob, rim: 0, glint: 0 },
    eye: { a: 0, dy: bob, rim: 0, glint: 0 }, pupil: { a: 0, dy: bob, rim: 0, glint: 0 },
    armFront: { a: armA, dy: bob, rim: rimB, glint: glintB }, sword: { a: armA, dy: bob, rim: rimB, glint: glintB + 0.2 },
  };
}
function computeAirborneAnims() {
  const legA = 0.5, armA = -0.5, rimB = 0.35, glintB = 0.45;
  return {
    cape: { a: -0.3, dy: 0, rim: 0, glint: 0 },
    armBack: { a: armA, dy: 0, rim: rimB, glint: glintB }, legBack: { a: -legA, dy: 0, rim: 0, glint: 0 },
    shoeBack: { a: -legA, dy: 0, rim: 0, glint: 0 }, body: { a: 0, dy: 0, rim: 0, glint: 0 },
    scarf: { a: 0, dy: 0, rim: 0, glint: 0 }, head: { a: 0, dy: 0, rim: 0, glint: 0 }, hair: { a: 0, dy: 0, rim: 0, glint: 0 },
    legFront: { a: legA, dy: 0, rim: 0, glint: 0 }, shoeFront: { a: legA, dy: 0, rim: 0, glint: 0 },
    eye: { a: 0, dy: 0, rim: 0, glint: 0 }, pupil: { a: 0, dy: 0, rim: 0, glint: 0 },
    armFront: { a: armA, dy: 0, rim: rimB, glint: glintB }, sword: { a: armA - 0.3, dy: 0, rim: rimB, glint: glintB },
  };
}
// 动画烘焙（idle/moving 曲线表，全字段保留）
function buildBakeTable() {
  const buckets = 100, duration = 2.0;
  const table = { idle: {}, moving: {} };
  for (let b = 0; b < buckets; b++) {
    const t = (b / buckets) * duration;
    const srcs = { idle: computeIdleAnims(t), moving: computeMovingAnims((t / duration) * Math.PI * 2) };
    for (const state of ['idle', 'moving']) {
      for (const key in srcs[state]) {
        if (!table[state][key]) {
          table[state][key] = { a: new Float32Array(buckets), dy: new Float32Array(buckets), rim: new Float32Array(buckets), glint: new Float32Array(buckets) };
        }
        const T = table[state][key], s = srcs[state][key];
        T.a[b] = s.a || 0; T.dy[b] = s.dy || 0; T.rim[b] = s.rim || 0; T.glint[b] = s.glint || 0;
      }
    }
  }
  return { buckets, duration, table };
}
const bakedTable = buildBakeTable();
function getFrameAnims(t, moving, airborne, phase) {
  if (airborne) return computeAirborneAnims();
  const state = moving ? 'moving' : 'idle';
  if (!bakeEnabled) return state === 'idle' ? computeIdleAnims(t) : computeMovingAnims(phase);
  const { buckets, duration, table } = bakedTable;
  const src = table[state];
  const phaseT = state === 'idle' ? t : (phase / (2 * Math.PI)) * duration;
  const f = (((phaseT % duration) + duration) % duration) / duration * buckets;
  const i = Math.floor(f) % buckets, u = f - Math.floor(f), j = (i + 1) % buckets;
  const result = {};
  for (const key in src) {
    const T = src[key];
    result[key] = { a: T.a[i] * (1 - u) + T.a[j] * u, dy: T.dy[i] * (1 - u) + T.dy[j] * u, rim: T.rim[i] * (1 - u) + T.rim[j] * u, glint: T.glint[i] * (1 - u) + T.glint[j] * u };
  }
  return result;
}

// ---------- UI ----------
const dirRow = document.getElementById('dirRow');
const dirButtons = [];
for (let i = 0; i < 8; i++) {
  const b = document.createElement('button');
  b.textContent = i + 1;
  b.onclick = () => {
    char.variant = i; char.lockedVariant = true; updateDirButtons();
    const lb = document.getElementById('btnLock');
    lb.textContent = '锁定: 开'; lb.classList.add('on');
  };
  dirRow.appendChild(b); dirButtons.push(b);
}
function updateDirButtons() { dirButtons.forEach((b, i) => b.classList.toggle('on', i === char.variant)); }
updateDirButtons();
const cosRow = document.getElementById('cosRow');
for (const key in COSTUMES) {
  const b = document.createElement('button');
  b.textContent = COSTUMES[key].label;
  b.onclick = () => { currentCostume = key; updateCosButtons(); };
  b.dataset.key = key; cosRow.appendChild(b);
}
function updateCosButtons() { cosRow.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.key === currentCostume)); }
updateCosButtons();
document.getElementById('btnBake').onclick = function () { bakeEnabled = !bakeEnabled; this.textContent = '烘焙: ' + (bakeEnabled ? '开' : '关'); this.classList.toggle('on', bakeEnabled); };
document.getElementById('btnLock').onclick = function () { char.lockedVariant = !char.lockedVariant; this.textContent = '锁定: ' + (char.lockedVariant ? '开' : '关'); this.classList.toggle('on', char.lockedVariant); };
const debugEl = document.getElementById('debug');
document.getElementById('btnDebug').onclick = function () { debugEnabled = !debugEnabled; this.textContent = '调试: ' + (debugEnabled ? '开' : '关'); this.classList.toggle('on', debugEnabled); debugEl.style.display = debugEnabled ? 'block' : 'none'; };

// ---------- 点击查看像素身份（CPU 读同一批烘焙瓦片，保证一致） ----------
let elapsed = 0;
function partCenter(params, angle, dy) {
  const c = Math.cos(angle), s = Math.sin(angle);
  const rx = params.off[0] * c - params.off[1] * s;
  const ry = params.off[0] * s + params.off[1] * c;
  return [char.x + params.pivot[0] + rx, char.y + params.pivot[1] + ry + dy];
}
canvas.addEventListener('click', (e) => {
  if (!debugEnabled || !atlasState) return;
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) / rect.width * lowW;
  const my = (e.clientY - rect.top) / rect.height * VIEW_H;
  const camX = char.x, camY = 22 + char.y * 0.35;
  const wx = camX + (mx - lowW / 2), wy = camY + (VIEW_H / 2 - my);
  const sorted = sortParts(PARTS, char.variant);
  const anims = getFrameAnims(elapsed, char.moving, !char.onGround, char.phase);
  for (let i = sorted.length - 1; i >= 0; i--) {
    const part = sorted[i];
    const entry = atlasState.map.get(part.key);
    if (!entry) continue;
    const { tile, resolved } = entry;
    const an = anims[part.key] || { a: 0, dy: 0 };
    const [cxw, cyw] = partCenter(resolved.params, an.a, an.dy);
    const dx = wx - cxw, dy = wy - cyw;
    const c = Math.cos(an.a), s = Math.sin(an.a);
    const lupX = dx * c + dy * s, lupY = -dx * s + dy * c;
    const gx = Math.floor(lupX + 0.5), gy = Math.floor(-lupY + 0.5);
    const tx = tile.cx + gx, ty = tile.cy + gy;
    if (tx < 0 || ty < 0 || tx >= tile.w || ty >= tile.h) continue;
    const r = tile.data[(ty * tile.w + tx) * 4];
    if (r < 128) {
      const key = pixelKey(part.key, char.variant, gx, gy);
      const sem = semanticTable.get(key);
      debugEl.innerHTML =
        `<b>${part.key}</b> · variant ${char.variant} · costume ${currentCostume}<br>` +
        `局部格 (${gx}, ${gy}) · 表面档位 ${r}<br>` +
        `身份 <span class="sem">${key}</span><br>` +
        `语义 ${sem ? `<span class="sem">${JSON.stringify(sem)}</span>` : '（无）'}`;
      return;
    }
  }
  debugEl.innerHTML = '<span style="color:#6a6a9a">未命中</span>';
});

// ---------- 主循环 ----------
const uLoc = (pr, n) => gl.getUniformLocation(pr, n);
const partU = { cam: uLoc(partProg, 'uCam'), vh: uLoc(partProg, 'uViewHalf'), res: uLoc(partProg, 'uRes'), time: uLoc(partProg, 'uTime'), atlas: uLoc(partProg, 'uAtlas'), pal: uLoc(partProg, 'uPal') };
const solidU = { cam: uLoc(solidProg, 'uCam'), vh: uLoc(solidProg, 'uViewHalf') };
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; elapsed += dt;
  updateCharacter(dt);
  const state = ensureAtlas(gl, char.variant, currentCostume);
  const anims = getFrameAnims(elapsed, char.moving, !char.onGround, char.phase);
  const sorted = sortParts(PARTS, char.variant);
  const els = [];
  sorted.forEach((part, idx) => {
    const entry = state.map.get(part.key);
    if (!entry) return;
    const { tile, place, resolved } = entry;
    const p = resolved.params;
    const an = anims[part.key] || { a: 0, dy: 0, rim: 0, glint: 0 };
    const [cxw, cyw] = partCenter(p, an.a, an.dy);
    els.push({
      pos: [cxw, cyw], size: [tile.w, tile.h], rot: an.a,
      tileCx: tile.cx, tileCy: tile.cy,
      tile: [place[0], place[1], tile.w, tile.h],
      family: palIndex(p.pal), seed: (idx * 0.137) % 1,
      modes: [p.light, p.outline, p.rim, p.glint],
      param: [Math.min(1, (p.rimI || 0) + (an.rim || 0)), Math.min(1, (p.glintI || 0) + (an.glint || 0)), (idx * 0.137) % 1],
    });
  });
  const camX = char.x, camY = 22 + char.y * 0.35;
  gl.viewport(0, 0, lowW, VIEW_H);
  gl.clearColor(0.070, 0.070, 0.157, 1);
  gl.clearDepth(1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.disable(gl.DEPTH_TEST);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.useProgram(solidProg);
  gl.uniform2f(solidU.cam, camX, camY);
  gl.uniform2f(solidU.vh, lowW / 2, VIEW_H / 2);
  gl.bindVertexArray(solidVAO);
  gl.bindBuffer(gl.ARRAY_BUFFER, solidBuf);
  const sc = buildScenery(char.x, char.y, char.onGround);
  gl.bufferData(gl.ARRAY_BUFFER, sc, gl.DYNAMIC_DRAW);
  gl.drawArrays(gl.TRIANGLES, 0, sc.length / 9);
  gl.disable(gl.BLEND);
  gl.enable(gl.DEPTH_TEST);
  gl.depthFunc(gl.LESS);
  gl.useProgram(partProg);
  gl.uniform2f(partU.cam, camX, camY);
  gl.uniform2f(partU.vh, lowW / 2, VIEW_H / 2);
  gl.uniform2f(partU.res, lowW, VIEW_H);
  gl.uniform1f(partU.time, elapsed);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, state.tex); gl.uniform1i(partU.atlas, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, palTex); gl.uniform1i(partU.pal, 1);
  gl.bindVertexArray(partVAO);
  gl.bindBuffer(gl.ARRAY_BUFFER, instBuf);
  gl.bufferData(gl.ARRAY_BUFFER, packInstances(els), gl.DYNAMIC_DRAW);
  gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, els.length);
  gl.bindVertexArray(null);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

window.PSA = { char, PARTS, COSTUMES, semanticTable, pixelKey, PAL, tileCache };
</script>
